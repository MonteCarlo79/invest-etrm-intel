queries:
  - id: e_fj_send_price
    kind: sql
    source: staging.spot_interprov_flow
    sql: >
      select report_date, metric_type, price_yuan_kwh, time_period, source_pdf
      from staging.spot_interprov_flow
      where province_cn = '福建' and direction = '送端'
        and report_date >= current_date - 130
      order by report_date
  - id: e_gd_rt_prices
    kind: sql
    source: marketdata.spot_prices_hourly
    sql: >
      select datetime, rt_price as gd_rt, da_price as gd_da
      from marketdata.spot_prices_hourly
      where province = '广东' and datetime >= current_date - 135
      order by datetime
  - id: e_fj_disclosure_sep25
    kind: kb_excerpt
    source: staging.spot_knowledge_docs
    title_like: 福建电力市场2025年9月信息披露报告
    max_chars: 400
