tracks:
- id: market_fundamentals
  title: 'Market fundamentals: price formation, merit order, market designs, products'
  concepts:
  - id: electricity_as_commodity
    track: market_fundamentals
    scope: Electricity's physical properties—non-storability, instantaneous balancing
      requirement, and network constraints—that distinguish it from other commodities
      and drive unique price dynamics.
    level: foundation
    prerequisites: []
    markets:
    - EU
    - GB
    - US
    - AU
    - CN
    sources:
    - id: dphil_thesis
      use: background
    originality: synthesized
  - id: supply_demand_equilibrium
    track: market_fundamentals
    scope: The fundamental mechanism by which electricity spot prices are determined
      through the intersection of aggregate supply (the merit stack) and inelastic
      demand in each settlement period.
    level: foundation
    prerequisites:
    - electricity_as_commodity
    markets:
    - EU
    - GB
    - US
    - AU
    - CN
    sources:
    - id: dphil_thesis
      use: background
    - id: overview_of_power_dispatch_models
      use: background
    - id: storage_value
      use: background
    originality: synthesized
  - id: merit_order_and_srmc
    track: market_fundamentals
    scope: The cost-ranked dispatch sequence of generation technologies by short-run
      marginal cost that determines which plants run at any demand level and sets
      the market-clearing price.
    level: foundation
    prerequisites:
    - supply_demand_equilibrium
    markets:
    - EU
    - GB
    - US
    - AU
    sources:
    - id: overview_of_power_dispatch_models
