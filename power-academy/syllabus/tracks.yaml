      use: background
    - id: dipeng_models
      use: background
    originality: synthesized
  - id: marginal_cost_pricing
    track: market_fundamentals
    scope: The principle that the wholesale electricity clearing price equals the
      short-run marginal cost of the last (most expensive) unit dispatched to meet
      demand, including fuel, carbon, and variable O&M costs.
    level: foundation
    prerequisites:
    - merit_order_and_srmc
    markets:
    - EU
    - GB
    - US
    - AU
    sources:
    - id: overview_of_power_dispatch_models
