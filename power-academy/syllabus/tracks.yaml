    originality: synthesized
  - id: fuel_and_carbon_cost_inputs
    track: market_fundamentals
    scope: The role of gas, coal, oil, and CO2 allowance prices as the primary variable
      cost drivers that position generators in the merit order and transmit commodity
      price signals into wholesale electricity prices.
    level: foundation
    prerequisites:
