- id: price_curve_modelling
  title: 'Price and curve modelling: mean reversion, spikes, forward curves, shaping'
  concepts:
  - id: stochastic_process_foundations
    track: price_curve_modelling
    scope: Introduces the core continuous-time stochastic process building blocks—Brownian
      motion, Itô's lemma, and SDEs—needed before any energy price model can be understood.
    level: foundation
    prerequisites: []
    markets:
    - EU
    - GB
    - US
    - AU
    - CN
    sources: []
    originality: original
  - id: gbm_and_lognormal_prices
    track: price_curve_modelling
    scope: Covers geometric Brownian motion as a baseline commodity price model, its
      log-normal distributional implications, and why it is the default assumption
      in Black-Scholes and Margrabe-type spread option frameworks.
    level: foundation
    prerequisites:
    - stochastic_process_foundations
