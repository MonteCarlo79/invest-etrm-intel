events {}

http {
    map $http_upgrade $connection_upgrade {
        default   keep-alive;
        websocket upgrade;
    }

    upstream deeptutor_api {
        server localhost:8001;
    }

    upstream deeptutor_frontend {
        server localhost:3782;
    }

    server {
        listen 8530;

        # Health check endpoint — nginx responds 200 directly.
        # FastAPI has GET / (not GET /health), so proxying to :8001/health would 404.
        # nginx responding directly is the lightest correct approach.
        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # All /api/ calls → FastAPI backend (routes: /api/v1/*)
        location /api/ {
            proxy_pass         http://deeptutor_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 100m;
        }

        # Everything else → Next.js frontend
        location / {
            proxy_pass         http://deeptutor_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            client_max_body_size 100m;
        }
    }
}
